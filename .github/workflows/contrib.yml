name: Contribution chart

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths-ignore:
      - assets/contrib.json
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: contrib
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the contribution calendar
        # No token: this reads the public profile calendar, which already counts private contributions.
        run: python3 tools/contrib.py
      - name: Commit it if it changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --quiet assets/contrib.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update the contribution chart" assets/contrib.json
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
